{% extends "admin/base.html" %}

{% block title %}{{ title }} | SNEAK//CTRL{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}">
    <span class="brand-mark">S//</span>
    <span>SNEAK<span class="brand-accent">//</span>CTRL</span>
  </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root {
    --primary: #1c1c1b;
    --secondary: #c7f000;
    --accent: #c7f000;
    --header-bg: #1c1c1b;
    --header-color: #f8f6ef;
    --link-fg: #315500;
    --button-bg: #1c1c1b;
    --button-hover-bg: #3c3c39;
  }

  body {
    background: #f1efe7;
  }

  #header {
    border-bottom: 4px solid var(--secondary);
  }

  #site-name a {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--header-color);
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  #site-name a:hover {
    color: var(--secondary);
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    background: var(--secondary);
    color: var(--primary);
    letter-spacing: 0;
  }

  .brand-accent {
    color: var(--secondary);
  }

  .module h2, .module caption, .inline-group h2 {
    background: var(--primary);
  }

  a:link, a:visited {
    color: var(--link-fg);
  }

  .button, input[type=submit], input[type=button], .submit-row input {
    border-radius: 0;
    font-weight: 700;
  }
</style>
{% endblock %}
